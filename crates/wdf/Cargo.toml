[package]
edition.workspace = true
name = "wdf"
version = "0.3.0"
description = "Safe idiomatic bindings to WDF APIs"
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords = ["windows", "wdf", "wdm"]
categories = [
  "api-bindings",
  "os",
]

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdf-macros.workspace = true
wdk-alloc.workspace = true
wdk-sys = { workspace = true, features = ["usb"] }
wdk.workspace = true
wdk-panic.workspace = true
wpp.workspace = true
paste.workspace = true
bitflags.workspace = true

[features]
# Cargo features cannot depend on the driver type, so this selects the
# kernel-mode/user-mode flavor of `wpp` (`Etw*`/`Event*` APIs).
kernel_mode = ["wpp/kernel_mode"]
user_mode = ["wpp/user_mode"]


