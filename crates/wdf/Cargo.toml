[package]
edition.workspace = true
name = "wdf"
version = "0.3.0"
description = "Safe idiomatic bindings to WDF APIs"
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords = ["windows", "wdf", "wdm"]
categories = [
  "api-bindings",
  "os",
]

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdf-macros.workspace = true
wdk-alloc.workspace = true
wdk-sys = { workspace = true, features = ["usb"] }
wdk.workspace = true
wdk-panic.workspace = true
wpp = { workspace = true, features = ["kernel_mode"] }
paste.workspace = true
bitflags.workspace = true

[features]
# Cargo features cannot depend on the driver type, so this selects the
# kernel-mode flavor of `wpp` (`Etw*` instead of `Event*` APIs). It is on by
# default for KMDF. UMDF drivers must depend on `wdf` with
# `default-features = false`.
default = ["kernel_mode"]
kernel_mode = ["wpp/kernel_mode"]


