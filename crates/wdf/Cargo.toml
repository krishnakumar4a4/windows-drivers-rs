[package]
edition.workspace = true
name = "wdf"
version = "0.3.0"
description = "Safe idiomatic bindings to WDF APIs"
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords = ["windows", "wdf", "wdm"]
categories = [
  "api-bindings",
  "os",
]

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdf-macros.workspace = true
wdk-alloc.workspace = true
wdk-sys = { workspace = true, features = ["usb"] }
wdk.workspace = true
wdk-panic.workspace = true
wpp.workspace = true
paste.workspace = true
bitflags.workspace = true

[features]
# Select exactly one tracing mode; WPP's default user mode is disabled by the
# workspace dependency so kernel-mode builds do not enable both modes.
kernel_mode = ["wpp/kernel_mode"]
user_mode = ["wpp/user_mode"]
ifr = ["wpp/ifr"]


